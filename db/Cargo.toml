[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { workspace = true }
common = { path = "../common" }
sea-orm = { version = "0.12.15", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros", "with-chrono"] }
sea-orm-migration = { version = "0.12.15", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
